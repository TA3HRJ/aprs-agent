name: Offline checks

# Every tools/check_*.py that needs no running server, on every push, on the
# Python the server runs (AUDIT-2026-10-08 F4). Until this, 56 checks ran only
# when someone remembered to run them. check_prop_bundle talks to a live
# agent and stays manual.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 3.10 with the lock is the server as it runs, and must pass. 3.12 and
    # 3.13 with the newest releases are the move ahead of 3.10's end
    # (AUDIT-2026-10-08 O3): they report, they do not block.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            lock: "-c requirements-lock-linux.txt"
            required: true
          - python: "3.12"
            lock: ""
            required: false
          - python: "3.13"
            lock: ""
            required: false
    continue-on-error: ${{ !matrix.required }}
    name: checks (${{ matrix.python }}${{ matrix.lock && ', locked' || ', newest' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ${{ matrix.lock }}
      - name: Run every offline check
        run: |
          failed=""
          for f in tools/check_*.py; do
            [ "$f" = tools/check_prop_bundle.py ] && continue
            echo "::group::$f"
            if ! python "$f"; then failed="$failed $f"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi
